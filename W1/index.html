<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人數位名片</title>
    <!-- 連結外部 CSS 檔 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 名片卡片容器 -->
    <div class="card">
        <!-- 1. 圓形大頭貼 -->
        <div class="avatar-box">
            <!-- 請將預設圖片網址換成你自己的照片檔名或連結 -->
            <img src="https://picsum.photos/200" alt="大頭貼" class="avatar">
        </div>

        <!-- 2. 名字與簡短自我介紹 -->
        <h1 class="name">你的名字</h1>
        <p class="bio">熱愛生活的 UI/UX 設計新手，正在用設計讓世界變得更有趣！</p>

        <!-- 3. 下方兩個按鈕 -->
        <div class="button-group">
            <a href="https://www.instagram.com/" target="_blank" class="btn btn-instagram">Instagram</a>
            <a href="mailto:your-email@example.com" class="btn btn-email">Email</a>
        </div>
    </div>

</body>
</html>
